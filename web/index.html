<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` é o que faz o `env(safe-area-inset-*)` devolver um valor de verdade no
      iPhone — sem ele o iOS responde 0, e os cinco lugares que já reservam espaço para a barra de
      gestos (a navegação de baixo, o AppLayout, os diálogos, a barra da página inicial) estavam a
      reservar nada. No app instalado isso é pior que no Safari: não há barra do navegador embaixo,
      então a navegação encosta direto na barra de gestos.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velos Wallet</title>
    <meta name="description" content="Seu dinheiro na direção certa." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Velos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0A2E24" />
    <!--
      Aplica o tema antes do primeiro paint, para não haver flash de tema errado (ADR 0009).
      Lê a escolha guardada; sem escolha, o padrão é o verde escuro (ADR 0016). O ThemeToggle
      escreve na mesma chave. A barra do navegador acompanha o tema.
    -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : true;
      } catch (e) {
        var dark = true;
      }
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0A2E24" : "#ECF1EA");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
