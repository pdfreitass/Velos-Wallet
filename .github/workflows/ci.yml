name: CI

# Spec 007 (A0.1): o que o CLAUDE.md pede antes de dizer "pronto", rodando sozinho em todo PR.
# Sem segredos (RN8): os testes de integração com o banco são PULADOS aqui, porque não há
# ConnectionStrings__Velos. Eles rodam na máquina de quem tem o user-secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compilar
        run: dotnet build api --configuration Release
      - name: Testar
        run: dotnet test api --configuration Release --no-build

  web:
    name: Front (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run test
      - name: Regra de senha igual no front e na API
        run: npm run check:password
      - name: Build
        run: npm run build

  e2e:
    name: E2E (só leitura, produção)
    # ADR 0022: o projeto `readonly` não cria dado nenhum — manifest, service worker, cache e
    # instalabilidade. O projeto `probe` escreve na produção (numa conta fixa de sonda) e fica
    # fora do CI de rotina.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E só leitura
        run: npm run test:e2e:readonly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
